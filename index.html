<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Velgrynd STREAMING - Global Cloud Server</title>
    <!-- Firebase SDK untuk sinkronisasi live antar HP berbeda -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap');
        :root { --bg-dark: #05070b; --bg-card: #0f131f; --border-color: #1a2234; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); background-image: linear-gradient(to bottom, rgba(5,7,11,0.92), rgba(5,7,11,0.98)), url('https://files.catbox.moe/o98fq6.png'); background-size: cover; background-position: center; background-attachment: fixed; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; }
        .glass-nav { background: rgba(15, 19, 31, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-color); }
        .glass-card { background: rgba(15, 19, 31, 0.85); backdrop-filter: blur(14px); border: 1px solid var(--border-color); }
        .btn-gradient { background: linear-gradient(135deg, #9333ea 0%, #ec4899 100%); transition: 0.3s; }
        .btn-gradient:hover { opacity: 0.9; transform: translateY(-1px); }
        .verified-badge { color: #3b82f6; display: inline-flex; align-items: center; margin-left: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-50 glass-nav px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="location.reload()">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-play text-white text-sm"></i>
            </div>
            <span class="text-lg font-extrabold tracking-wider bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Velgrynd</span>
        </div>

        <div class="hidden md:flex items-center flex-1 max-w-md mx-6">
            <div class="relative w-full">
                <input type="text" id="searchInput" oninput="searchVideos()" placeholder="Cari video server..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-full py-1.5 pl-10 pr-4 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
                <i class="fa-solid fa-search absolute left-3.5 top-2.5 text-gray-500 text-xs"></i>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="resetAllBansAndCache()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-2.5 py-1.5 rounded-xl text-[10px] font-bold border border-red-500/30 transition" title="Hapus Blokir & Reset Cache">
                <i class="fa-solid fa-rotate-right"></i> Reset Blokir
            </button>
            <div id="authNavContainer">
                <button onclick="openMemberAuthModal()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-200">Login</button>
            </div>
            <a href="upload.html" class="btn-gradient px-3 py-1.5 rounded-xl text-xs font-bold text-white shadow-lg flex items-center space-x-1">
                <i class="fa-solid fa-cloud-arrow-up"></i><span>Upload</span>
            </a>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- PROFIL & BANNER -->
        <div class="glass-card rounded-3xl p-6 border border-purple-500/30 space-y-4 bg-cover bg-center relative overflow-hidden" style="background-image: linear-gradient(to right, rgba(15,19,31,0.92), rgba(15,19,31,0.85)), url('https://files.catbox.moe/o98fq6.png');">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 relative z-10">
                <div class="flex items-center space-x-4 text-center md:text-left flex-col md:flex-row">
                    <div class="w-16 h-16 rounded-full border-2 border-purple-500 overflow-hidden bg-black flex-shrink-0">
                        <img src="https://files.catbox.moe/o98fq6.png" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <div class="flex items-center justify-center md:justify-start space-x-2">
                            <h2 id="profileDisplayName" class="text-lg font-bold text-white">Tamu Pengunjung</h2>
                            <span id="profileBadgeIcon" class="hidden"><i class="fa-solid fa-circle-check verified-badge"></i></span>
                        </div>
                        <p id="profileDisplaySub" class="text-xs text-gray-400">Server Cloud Real-time Aktif</p>
                        <div class="flex items-center justify-center md:justify-start space-x-2 pt-1 text-[10px]">
                            <span class="px-2 py-0.5 rounded-full bg-purple-900/60 border border-purple-500/40 text-purple-300 font-bold">Level <span id="userLevelDisplay">1</span></span>
                            <span class="text-gray-400">EXP: <span id="userExpDisplay">0</span></span>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="openOwnerAuthModal()" class="bg-purple-950/60 hover:bg-purple-900 text-purple-300 px-3 py-1.5 rounded-xl text-xs font-bold border border-purple-700/50">Owner (ID: 1)</button>
                    <button id="logoutSessionBtn" onclick="logoutSession()" class="hidden bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold border border-red-500/30">Log Out</button>
                </div>
            </div>
        </div>

        <!-- GRID VIDEO -->
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-video text-purple-400"></i>
                    <span>Video Server Cloud Publik</span>
                </h2>
                <span id="videoCountBadge" class="text-[10px] text-gray-400 bg-[#0f131f] px-2.5 py-1 rounded-full border border-[#1a2234]">0 Video</span>
            </div>

            <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="glass-nav py-4 px-6 mt-8 border-t border-[#1a2234] text-center space-y-1">
        <p class="text-xs font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Velgrynd STREAMING Engine © 2026</p>
        <div class="flex justify-center items-center space-x-2 pt-1">
            <a href="https://github.com/rayzekagenou-dev" target="_blank" class="text-[11px] text-purple-400 hover:text-white flex items-center space-x-1">
                <i class="fa-brands fa-github"></i><span>Velgrynd-Developer</span>
            </a>
        </div>
    </footer>

    <!-- MODAL MEMBER -->
    <div id="memberAuthModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="glass-card max-w-sm w-full p-6 rounded-3xl border border-purple-500/40 space-y-4 relative">
            <button onclick="closeMemberAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-bold text-white text-base text-center">Login Member</h3>
            <input type="email" id="inputMemberEmail" placeholder="Email..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-xs text-gray-200">
            <input type="text" id="inputMemberName" placeholder="Nama..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-xs text-gray-200">
            <button onclick="requestMemberOTP()" class="w-full btn-gradient py-2.5 rounded-xl text-xs font-bold text-white">Kirim OTP</button>
            <div id="otpBoxArea" class="hidden space-y-2 pt-2 border-t border-[#1a2234]">
                <p class="text-[11px] text-purple-300 text-center font-mono">OTP: <strong id="otpDisplayVal" class="text-white"></strong></p>
                <input type="text" id="inputUserOtpVal" maxlength="6" placeholder="Masukkan OTP..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-center text-xs tracking-widest text-white font-mono">
                <button onclick="verifyMemberOTP()" class="w-full bg-green-600 hover:bg-green-500 py-2 rounded-xl text-xs font-bold text-white">Konfirmasi</button>
            </div>
        </div>
    </div>

    <!-- MODAL OWNER -->
    <div id="ownerAuthModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="glass-card max-w-sm w-full p-6 rounded-3xl border border-purple-500/40 space-y-4 relative">
            <button onclick="closeOwnerAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            <div id="ownerStep1" class="space-y-3">
                <h3 class="font-bold text-white text-base text-center">Otentikasi Owner (ID: 1)</h3>
                <input type="email" id="inputOwnerEmail" placeholder="rayzekagenou@gmail.com" class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-xs text-gray-200">
                <button onclick="submitOwnerEmail()" class="w-full btn-gradient py-2.5 rounded-xl text-xs font-bold text-white">Lanjutkan</button>
            </div>
            <div id="ownerStep2" class="space-y-3 hidden">
                <h3 class="font-bold text-white text-base text-center">Kode Rahasia Owner</h3>
                <input type="password" id="inputOwnerCode" maxlength="6" placeholder="••••••" class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-center text-xs tracking-widest text-white font-mono">
                <button onclick="verifyOwnerCode()" class="w-full bg-green-600 hover:bg-green-500 py-2.5 rounded-xl text-xs font-bold text-white">Verifikasi</button>
            </div>
        </div>
    </div>

    <script>
        // INISIALISASI FIREBASE CLOUD DATABASE (SINKRON LINTAS PERANGKAT BERBEDA)
        const firebaseConfig = {
            databaseURL: "https://velgrynd-streaming-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('velgrynd_videos');

        function fetchGlobalVideos(callback) {
            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let videos = [];
                if (data) {
                    videos = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                    videos.reverse(); // Terbaru di atas
                }
                callback(videos);
            });
        }

        function isOwnerActive() { return sessionStorage.getItem('velgrynd_owner_logged') === 'true'; }
        function getCurrentUser() {
            try { const user = localStorage.getItem('velgrynd_current_user'); if(user) return JSON.parse(user); } catch(e){}
            return null;
        }

        // Hapus total semua blokir / ban
        function resetAllBansAndCache() {
            localStorage.removeItem('velgrynd_active_ban');
            localStorage.removeItem('velgrynd_device_banned');
            alert('Semua sistem blokir telah dihapus dan dibersihkan sepenuhnya!');
            location.reload();
        }

        let tempOtp = "", tempEmail = "", tempName = "";
        document.addEventListener("DOMContentLoaded", () => {
            fetchGlobalVideos((videos) => {
                window.globalCachedVideos = videos;
                renderVideos(videos);
            });
            updateProfileUI();
        });

        function updateProfileUI() {
            const user = getCurrentUser(), isOwner = isOwnerActive();
            const level = localStorage.getItem('velgrynd_user_level') || '1';
            const exp = localStorage.getItem('velgrynd_user_exp') || '0';
            document.getElementById('userLevelDisplay').innerText = level;
            document.getElementById('userExpDisplay').innerText = exp;

            if(isOwner) {
                document.getElementById('profileDisplayName').innerHTML = `Rayze Kagenou <i class="fa-solid fa-circle-check verified-badge"></i>`;
                document.getElementById('profileDisplaySub').innerHTML = `Owner Utama (ID: 1) | Level ${level}`;
                document.getElementById('profileBadgeIcon').classList.remove('hidden');
                document.getElementById('logoutSessionBtn').classList.remove('hidden');
                document.getElementById('authNavContainer').innerHTML = `<span class="text-xs text-purple-400 font-bold px-3 py-1.5 rounded-xl bg-purple-950/40 border border-purple-800">Owner</span>`;
            } else if(user) {
                document.getElementById('profileDisplayName').innerText = `${user.name} (ID: ${user.id})`;
                document.getElementById('profileDisplaySub').innerHTML = `Member Aktif | Level ${level}`;
                document.getElementById('logoutSessionBtn').classList.remove('hidden');
                document.getElementById('authNavContainer').innerHTML = `<span class="text-xs text-gray-300 font-bold px-3 py-1.5 rounded-xl bg-gray-800">${user.name}</span>`;
            }
        }

        function logoutSession() {
            if(confirm('Log Out dari sesi ini?')) {
                sessionStorage.removeItem('velgrynd_owner_logged');
                localStorage.removeItem('velgrynd_current_user');
                location.reload();
            }
        }

        function renderVideos(data) {
            const grid = document.getElementById('videoGrid');
            document.getElementById('videoCountBadge').innerText = `${data.length} Video`;
            if(data.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8 text-xs">Belum ada video di cloud server publik.</p>`;
                return;
            }
            grid.innerHTML = data.map(v => `
                <div onclick="sessionStorage.setItem('active_video_id', '${v.id}'); location.href='watch.html';" class="glass-card rounded-2xl overflow-hidden cursor-pointer flex flex-col group">
                    <div class="relative aspect-video bg-black flex items-center justify-center overflow-hidden">
                        <video src="${v.url}" class="w-full h-full object-cover group-hover:scale-105 transition"></video>
                        <div class="absolute bottom-2 right-2 bg-black/80 px-2 py-0.5 rounded text-[9px] text-white font-mono">Live Cloud</div>
                    </div>
                    <div class="p-3 space-y-1">
                        <div class="flex items-center justify-between text-[11px]">
                            <span class="text-purple-400 font-bold">${v.category}</span>
                            <span class="text-gray-400">${v.uploader} ${v.isOwner ? '<i class="fa-solid fa-circle-check verified-badge text-[10px]"></i>' : ''}</span>
                        </div>
                        <h3 class="font-bold text-white text-xs line-clamp-2">${v.title}</h3>
                    </div>
                </div>
            `).join('');
        }

        function searchVideos() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            if(window.globalCachedVideos) {
                renderVideos(window.globalCachedVideos.filter(v => v.title.toLowerCase().includes(q) || v.uploader.toLowerCase().includes(q)));
            }
        }

        function openMemberAuthModal() { document.getElementById('memberAuthModal').classList.remove('hidden'); }
        function closeMemberAuthModal() { document.getElementById('memberAuthModal').classList.add('hidden'); }
        function requestMemberOTP() {
            tempEmail = document.getElementById('inputMemberEmail').value.trim();
            tempName = document.getElementById('inputMemberName').value.trim();
            if(!tempEmail || !tempName) { alert('Isi data!'); return; }
            tempOtp = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('otpDisplayVal').innerText = tempOtp;
            document.getElementById('otpBoxArea').classList.remove('hidden');
        }
        function verifyMemberOTP() {
            if(document.getElementById('inputUserOtpVal').value.trim() !== tempOtp) { alert('OTP salah!'); return; }
            let lastId = parseInt(localStorage.getItem('velgrynd_last_member_id') || '1') + 1;
            localStorage.setItem('velgrynd_last_member_id', lastId);
            localStorage.setItem('velgrynd_current_user', JSON.stringify({ id: lastId, name: tempName, email: tempEmail }));
            location.reload();
        }

        function openOwnerAuthModal() {
            if(isOwnerActive()) { location.href='upload.html'; return; }
            document.getElementById('ownerAuthModal').classList.remove('hidden');
            document.getElementById('ownerStep1').classList.remove('hidden');
            document.getElementById('ownerStep2').classList.add('hidden');
        }
        function closeOwnerAuthModal() { document.getElementById('ownerAuthModal').classList.add('hidden'); }
        function submitOwnerEmail() {
            const e = document.getElementById('inputOwnerEmail').value.trim().toLowerCase();
            if(e !== 'rayzekagenou@gmail.com' && e !== 'velgrynd@gmail.com') { alert('Bukan owner!'); return; }
            document.getElementById('ownerStep1').classList.add('hidden');
            document.getElementById('ownerStep2').classList.remove('hidden');
        }
        function verifyOwnerCode() {
            if(document.getElementById('inputOwnerCode').value.trim() !== '552255') { alert('Kode salah!'); return; }
            sessionStorage.setItem('velgrynd_owner_logged', 'true');
            location.href='upload.html';
        }
    </script>
</body>
</html>
