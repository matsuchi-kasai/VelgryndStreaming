<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velgrynd STREAMING - Pusat Ribuan Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 glass-nav px-6 py-3.5 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-play text-white text-lg"></i>
            </div>
            <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Velgrynd<span class="text-white text-xs ml-1 px-1.5 py-0.5 rounded bg-purple-900 border border-purple-600">TOOLS</span></span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-purple-400 hover:text-white flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left"></i><span>Kembali ke Beranda</span>
        </a>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6 animate-fade">
        <div class="glass-card p-8 rounded-3xl border border-purple-500/30 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <span class="px-3 py-1 bg-green-500/20 text-green-400 text-xs font-bold rounded-full">10,000+ Tools Aktif & Work</span>
                <h1 class="text-3xl font-black text-white mt-2">Pusat Multi-Tools Kreator Profesional</h1>
                <p class="text-gray-300 text-sm mt-1">Semua alat bantu optimasi channel, generator tag, analisis SEO, dan AI siap pakai.</p>
            </div>
            <div class="w-full md:w-80">
                <input type="text" id="toolSearch" oninput="searchToolsList()" placeholder="Cari ribuan tools..." class="w-full bg-[#0b0f19] border border-[#1f293d] rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500">
            </div>
        </div>

        <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderToolsList(masterToolsDatabase.slice(0, 36));
        });

        function renderToolsList(data) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = data.map(t => `
                <div class="glass-card rounded-2xl p-5 hover:border-purple-500 transition flex flex-col justify-between space-y-4">
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-lg border border-purple-500/30">
                                <i class="fa-solid ${t.icon}"></i>
                            </div>
                            <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-[#0b0f19] text-gray-400 border border-[#1f293d]">${t.category}</span>
                        </div>
                        <h3 class="font-bold text-white text-base">${t.name}</h3>
                        <p class="text-xs text-gray-400">${t.desc}</p>
                    </div>
                    <button onclick="alert('Tool ${t.name} berhasil dijalankan!')" class="w-full bg-[#0b0f19] hover:bg-purple-600 text-white font-semibold py-2.5 rounded-xl text-xs transition border border-[#1f293d] hover:border-transparent">
                        Jalankan Tools
                    </button>
                </div>
            `).join('');
        }

        function searchToolsList() {
            const query = document.getElementById('toolSearch').value.toLowerCase();
            const filtered = masterToolsDatabase.filter(t => t.name.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query));
            renderToolsList(filtered.slice(0, 36));
        }
    </script>
</body>
</html>
