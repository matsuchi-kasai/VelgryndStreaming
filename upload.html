<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velgrynd STREAMING - Studio Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="glass-card max-w-xl w-full p-8 md:p-10 rounded-3xl border border-purple-500/30 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-[#1a2234] pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-lg border border-purple-500/30">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white">Studio Upload Video</h1>
                    <p class="text-xs text-gray-400">Server bebas lag, video langsung bisa ditonton</p>
                </div>
            </div>
            <a href="index.html" class="text-xs text-purple-400 hover:underline">Kembali</a>
        </div>

        <div class="space-y-4">
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-300">Nama Kreator / Channel</label>
                <input type="text" id="uploaderName" placeholder="Nama Anda..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-300">Judul Video</label>
                <input type="text" id="videoTitle" placeholder="Judul konten..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-300">Kategori</label>
                <select id="videoCategory" class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500">
                    <option value="Teknologi">💻 Teknologi & Coding</option>
                    <option value="Gaming">🎮 Gaming & Esports</option>
                    <option value="Musik">🎵 Musik & Cover</option>
                    <option value="Vlog">🍿 Vlog & Hiburan</option>
                </select>
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-300">Pilih File Video (.mp4 / .mkv)</label>
                <input type="file" id="videoFile" accept="video/*" class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl p-2.5 text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-gray-300">Deskripsi</label>
                <textarea id="videoDesc" rows="3" placeholder="Deskripsi..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-4 py-3 text-sm text-gray-200 focus:outline-none focus:border-purple-500"></textarea>
            </div>

            <button onclick="publishVideo()" class="w-full btn-gradient py-3.5 rounded-xl font-bold text-white shadow-lg transition">Publikasikan Video Sekarang</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(isOwnerActive()) {
                document.getElementById('uploaderName').value = "Velgrynd Official";
            }
        });

        function publishVideo() {
            const uploader = document.getElementById('uploaderName').value.trim() || "Kreator";
            const title = document.getElementById('videoTitle').value.trim();
            const category = document.getElementById('videoCategory').value;
            const desc = document.getElementById('videoDesc').value.trim();
            const fileInput = document.getElementById('videoFile');

            if(!title) { alert('Judul wajib diisi!'); return; }
            if(!fileInput.files || fileInput.files.length === 0) { alert('Pilih file video!'); return; }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const base64Video = e.target.result;
                const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                const newVideoObj = {
                    id: Date.now(),
                    title: title,
                    uploader: uploader,
                    isOwner: isOwnerActive(),
                    category: category,
                    date: today,
                    views: "1",
                    likes: "0",
                    desc: desc || "Video diunggah ke server.",
                    url: base64Video,
                    comments: []
                };

                saveVideoToStorage(newVideoObj);
                alert('Berhasil! Video langsung tayang dan dapat ditonton.');
                window.location.href = 'index.html';
            };

            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
