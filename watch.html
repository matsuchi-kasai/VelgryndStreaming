<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velgrynd STREAMING - Pemutar Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 glass-nav px-6 py-3.5 flex items-center justify-between">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-play text-white text-lg"></i>
            </div>
            <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">Velgrynd<span class="text-white text-xs ml-1 px-1.5 py-0.5 rounded bg-purple-900 border border-purple-600">PLAYER</span></span>
        </a>
        <a href="index.html" class="text-sm font-semibold text-purple-400 hover:text-white flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left"></i><span>Kembali ke Beranda</span>
        </a>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <!-- PEMUTAR VIDEO DIPERBAIKI TOTAL AGAR 100% WORK -->
                <div class="w-full bg-black rounded-3xl overflow-hidden shadow-2xl border border-purple-500/35 aspect-video flex items-center justify-center">
                    <video id="mainPlayer" controls autoplay playsinline class="w-full h-full object-contain" src=""></video>
                </div>

                <div class="glass-card p-6 rounded-3xl space-y-4">
                    <h1 id="videoTitle" class="text-xl md:text-2xl font-black text-white">Judul Video</h1>
                    
                    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-[#1a2234] pb-4">
                        <div class="flex items-center space-x-3">
                            <div id="uploaderAvatar" class="w-11 h-11 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white text-lg shadow-lg">V</div>
                            <div>
                                <h4 id="uploaderName" class="font-bold text-white text-sm flex items-center">Nama Uploader</h4>
                                <p id="videoDate" class="text-xs text-gray-400">Tanggal Upload</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button onclick="handleLike()" class="bg-[#0b0f19] hover:bg-gray-800 px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center space-x-2 border border-[#1a2234] transition">
                                <i class="fa-solid fa-thumbs-up text-purple-400"></i>
                                <span id="likeCount">12</span>
                            </button>
                        </div>
                    </div>

                    <div class="bg-[#0b0f19] p-4 rounded-2xl border border-[#1a2234] text-sm text-gray-300">
                        <p id="videoDesc" class="whitespace-pre-line">Deskripsi...</p>
                    </div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="glass-card p-6 rounded-3xl space-y-4">
                    <h3 class="font-bold text-white text-base flex items-center space-x-2">
                        <i class="fa-solid fa-comments text-purple-400"></i>
                        <span>Komentar Publik (<span id="commentCount">0</span>)</span>
                    </h3>

                    <div class="space-y-3">
                        <input type="text" id="commentAuthor" placeholder="Nama Anda..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-purple-500">
                        <textarea id="commentText" rows="2" placeholder="Tulis komentar..." class="w-full bg-[#0b0f19] border border-[#1a2234] rounded-xl px-3 py-2 text-xs text-gray-200 focus:outline-none focus:border-purple-500"></textarea>
                        <button onclick="addComment()" class="w-full btn-gradient py-2.5 rounded-xl text-xs font-bold text-white shadow-lg transition">Kirim Komentar</button>
                    </div>

                    <hr class="border-[#1a2234]">

                    <div id="commentList" class="space-y-3 max-h-96 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        let currentVideoObj = null;

        document.addEventListener("DOMContentLoaded", () => {
            const videoId = sessionStorage.getItem('active_video_id');
            const all = getAllVideos();
            currentVideoObj = all.find(v => v.id == videoId) || all[0];

            if(currentVideoObj) {
                const player = document.getElementById('mainPlayer');
                player.src = currentVideoObj.url;
                player.load();

                document.getElementById('videoTitle').innerText = currentVideoObj.title;
                document.getElementById('uploaderName').innerHTML = `${currentVideoObj.uploader} ${currentVideoObj.isOwner ? '<i class="fa-solid fa-circle-check verified-badge ml-1"></i>' : ''}`;
                document.getElementById('uploaderAvatar').innerText = currentVideoObj.uploader ? currentVideoObj.uploader.charAt(0).toUpperCase() : 'V';
                document.getElementById('videoDate').innerText = `Diunggah tanggal ${currentVideoObj.date}`;
                document.getElementById('likeCount').innerText = currentVideoObj.likes || "12";
                document.getElementById('videoDesc').innerText = currentVideoObj.desc;
                renderComments(currentVideoObj.comments || []);
            }
        });

        function renderComments(comments) {
            document.getElementById('commentCount').innerText = comments.length;
            const list = document.getElementById('commentList');
            if(comments.length === 0) {
                list.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">Belum ada komentar.</p>`;
                return;
            }
            list.innerHTML = comments.map(c => `
                <div class="bg-[#0b0f19] p-3.5 rounded-2xl border border-[#1a2234] space-y-1">
                    <div class="font-bold text-xs text-purple-400">${c.user}</div>
                    <p class="text-xs text-gray-300">${c.text}</p>
                </div>
            `).join('');
        }

        function addComment() {
            const author = document.getElementById('commentAuthor').value.trim() || "Penonton";
            const text = document.getElementById('commentText').value.trim();
            if(!text) { alert('Komentar kosong!'); return; }

            if(!currentVideoObj.comments) currentVideoObj.comments = [];
            currentVideoObj.comments.unshift({ user: author, text: text });
            updateVideoInStorage(currentVideoObj);
            renderComments(currentVideoObj.comments);
            document.getElementById('commentText').value = "";
        }

        function handleLike() {
            let likes = parseInt(document.getElementById('likeCount').innerText) || 10;
            likes++;
            document.getElementById('likeCount').innerText = likes;
            currentVideoObj.likes = likes.toString();
            updateVideoInStorage(currentVideoObj);
            alert('Suka video ini!');
        }

        function updateVideoInStorage(updatedVid) {
            try {
                let stored = [];
                const data = localStorage.getItem('velgrynd_all_videos');
                if(data) stored = JSON.parse(data);
                const index = stored.findIndex(v => v.id == updatedVid.id);
                if(index !== -1) {
                    stored[index] = updatedVid;
                    localStorage.setItem('velgrynd_all_videos', JSON.stringify(stored));
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
